resources:
  jobs:
    loanlake_pipeline:
      name: loanlake_pipeline
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/00_setup_catalog.py

        - task_key: generate_landing_data
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ../notebooks/01_generate_landing_data.py